# Scala CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/configuration-reference/ for more details
#
version: 2.1

jobs:
  build:
    docker:
      # cimg/openjdk ships Maven and Gradle but not sbt, so sbt is installed below
      - image: cimg/openjdk:17.0

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - run:
          name: Install sbt (version pinned in project/build.properties)
          command: |
            SBT_VERSION=$(sed -n 's/^sbt.version=//p' project/build.properties)
            curl -fsSL --retry 3 "https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz" | tar -xz -C ~
            echo 'export PATH="$HOME/sbt/bin:$PATH"' >> "$BASH_ENV"

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-

      - run: cat /dev/null | sbt Test/compile

      - save_cache:
          paths:
            - ~/.ivy2/cache
            - ~/.sbt
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}

      # run tests!
      - run:
          name: Run tests
          command: cat /dev/null | sbt "testOnly * -- -l Slow"

      # Collect test results from all modules
      - run:
          name: Aggregate test results
          command: |
            mkdir -p target/test-reports
            find . -path '*/target/test-reports/*' -name '*.xml' -exec cp {} target/test-reports/ \;
          when: always

      - store_test_results:
          path: target/test-reports

workflows:
  build:
    jobs:
      - build
