# CircleCI configuration for Number (the standard Phasmid template, for a multi-module build)
#
# Check https://circleci.com/docs/configuration-reference/ for more details
#
version: 2.1

jobs:
  build:
    docker:
      # cimg/openjdk ships Maven and Gradle but not sbt, so sbt is installed below
      - image: cimg/openjdk:21.0

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - run:
          name: Install sbt (version pinned in project/build.properties)
          command: |
            SBT_VERSION=$(sed -n 's/^sbt.version=//p' project/build.properties)
            curl -fsSL --retry 3 "https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz" | tar -xz -C ~
            echo 'export PATH="$HOME/sbt/bin:$PATH"' >> "$BASH_ENV"

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-

      - run:
          name: Compile
          command: cat /dev/null | sbt Test/compile

      - save_cache:
          paths:
            - ~/.ivy2/cache
            - ~/.sbt
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}-{{ checksum "project/plugins.sbt" }}

      - run:
          name: Test (excluding Slow)
          command: cat /dev/null | sbt "testOnly * -- -l Slow"

      # Generate the unified Scaladoc (catches doc warnings, and it is what GitHub Pages publishes)
      - run:
          name: Doc
          command: cat /dev/null | sbt unidoc

      # Collect test results from all modules
      - run:
          name: Aggregate test results
          command: |
            mkdir -p target/test-reports
            find . -path '*/target/test-reports/*' -name '*.xml' -exec cp {} target/test-reports/ \;
          when: always

      - store_test_results:
          path: target/test-reports

      # Coverage, reported but not enforced. It starts with clean, because the earlier steps' classes aren't instrumented.
      - run:
          name: Coverage
          command: cat /dev/null | sbt clean coverage "testOnly * -- -l Slow" coverageAggregate

      - store_artifacts:
          path: target/scala-3.9.0/scoverage-report
          destination: coverage

      # Send coverage to Codacy. It needs the project's API token in CircleCI as CODACY_PROJECT_TOKEN; without it the step does nothing.
      - run:
          name: Upload coverage to Codacy
          command: |
            if [ -n "${CODACY_PROJECT_TOKEN:-}" ]; then
              bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r target/scala-3.9.0/coverage-report/cobertura.xml || echo "The upload to Codacy failed (coverage isn't enforced, so the build carries on)"
            else
              echo "CODACY_PROJECT_TOKEN isn't set, so coverage isn't sent to Codacy"
            fi

workflows:
  build:
    jobs:
      - build
